<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Starr Surveying</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #ffffff; color: #111827; padding: 24px;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center;
    }
    .box { max-width: 440px; display: grid; gap: 12px; }
    h1 { margin: 0; font-size: 20px; color: #BD1218; }
    p { margin: 0; font-size: 14px; line-height: 1.6; color: #4b5563; }
    button {
      justify-self: center; margin-top: 4px; padding: 9px 20px; font: inherit; font-size: 13.5px;
      background: #BD1218; color: #fff; border: 0; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>No connection</h1>
    <!-- Says what is true rather than "something went wrong". Nothing authenticated is cached (see
         sw.js), so promising the job list is still here would be a lie the reader finds out in one
         tap — and a field crew acts on what this page says. -->
    <p>
      Starr Surveying needs a connection to load jobs, hours, receipts and research — they live on the
      server, not on this device.
    </p>
    <p>
      <strong>Nothing you saved has been lost.</strong> Anything already submitted is on the server;
      anything typed and not yet sent is still in the page you came from.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
