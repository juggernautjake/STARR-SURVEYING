<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Andrew Ash</title>
    <!--
      Deliberately dependency-free: no webfont, no stylesheet, no script. This page is served when the
      network is gone, so anything it has to fetch is something it cannot have. The colours are the
      Ink & Gold theme's literals rather than custom properties, because the stylesheet that defines
      them is exactly the file that is unavailable.
    -->
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #0a0d14;
        color: #ece6da;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        line-height: 1.6;
      }
      .wrap { max-width: 420px; }
      .mark {
        width: 10px; height: 10px; transform: rotate(45deg);
        background: #d9b65b; margin: 0 auto 28px;
        box-shadow: 0 0 18px -2px #d9b65b;
      }
      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.75rem; font-weight: 600; margin: 0 0 12px; letter-spacing: 0.02em;
      }
      p { color: #9aa4b8; margin: 0 0 28px; font-size: 0.9375rem; }
      button {
        background: #d9b65b; color: #0a0d14; border: 0; border-radius: 3px;
        padding: 13px 26px; font-size: 0.8125rem; font-weight: 600;
        letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; font-family: inherit;
      }
      button:hover { background: #f0d68a; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark"></div>
      <h1>You're offline</h1>
      <p>
        This page needs a connection. Anything you already had open should still work — reconnect and
        try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
